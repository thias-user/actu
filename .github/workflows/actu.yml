name: ACTU – mise à jour et publication

on:
  schedule:
    # 10h à Paris = 9h UTC l'hiver, 8h UTC l'été : on passe aux deux heures, le robot ne travaille qu'une fois par jour.
    - cron: "5 8 * * *"
    - cron: "5 9 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Mettre à jour tout de suite"
        type: boolean
        default: true
      only:
        description: "Une seule partie (vide = tout ; traduction, replays, arte, research)"
        type: string
        default: ""
  push:
    branches: [main]
    paths: ["app/**", "robot/**", ".github/workflows/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: actu
  cancel-in-progress: false

jobs:
  update:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      changed: ${{ steps.save.outputs.changed }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: robot/requirements.txt
      - run: pip install -r robot/requirements.txt
      - name: Mémoire des publications récentes (réseaux sociaux)
        uses: actions/cache@v4
        with:
          path: robot/state
          key: actu-state-${{ github.run_id }}
          restore-keys: actu-state-
      - name: Modèles de traduction gratuits (OPUS-MT, préparés une fois)
        id: models
        uses: actions/cache/restore@v4
        with:
          path: robot/models
          key: opus-mt-ct2-en_fr-es_fr-1
      - name: Préparation des modèles de traduction (seulement la première fois)
        id: prep
        if: steps.models.outputs.cache-hit != 'true'
        continue-on-error: true
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install "transformers>=4.40,<5"
          python robot/translate.py prepare
      - name: Mise en cache des modèles de traduction
        if: steps.models.outputs.cache-hit != 'true' && steps.prep.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: robot/models
          key: opus-mt-ct2-en_fr-es_fr-1
      - name: IA libre des analyses critiques (Qwen3-4B, téléchargée une fois)
        id: llm
        uses: actions/cache/restore@v4
        with:
          path: robot/llm
          key: llm-qwen3-4b-instruct-2507-q4km-1
      - name: Moteur de l'IA libre (llama.cpp)
        id: llmprep
        continue-on-error: true
        run: |
          pip install "llama-cpp-python==0.3.34" --only-binary=:all: --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu
          python robot/critique_ai.py prepare
      - name: Mise en cache de l'IA libre
        if: steps.llm.outputs.cache-hit != 'true' && steps.llmprep.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: robot/llm
          key: llm-qwen3-4b-instruct-2507-q4km-1
      - name: Collecte des articles, replays, ARTE, recherche
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          ACTU_READ_KEY: ${{ secrets.ACTU_READ_KEY }}
          FORCE: ${{ (github.event_name == 'workflow_dispatch' && inputs.force) && '--force' || '' }}
          ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.only || '' }}
        run: python robot/run_daily.py $FORCE ${ONLY:+--only "$ONLY"}
      - name: Enregistrement des nouvelles données
        id: save
        run: |
          git config user.name "actu-robot"
          git config user.email "actu-robot@users.noreply.github.com"
          git add app/data
          if git diff --cached --quiet; then
            echo "Rien de nouveau"
          else
            git commit -m "Édition du $(TZ=Europe/Paris date +%d/%m/%Y)"
            for i in 1 2 3 4 5; do git pull --rebase -q && git push && break; sleep 15; done
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: update
    if: always() && (github.event_name == 'push' || needs.update.outputs.changed == 'true')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: app
      - id: pages
        uses: actions/deploy-pages@v4
